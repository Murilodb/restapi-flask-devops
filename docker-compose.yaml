version: '3.9'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      restart: always

  api:
    build:
      context: .
    ports:
     - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MONGODB_DB=myapp
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=admin   
    restart: always
    depends_on:
      - mongo
    volumes:
      - ./applications:/app/applications
    cpus: 0.10

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.200.0/24
