version: '3.9'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      restart: always

  api:
    build:
      context: .
    ports:
     - "5000:5000"
    environment:
      - FLASK_ENV=development      
    restart: always
    depends_on:
      - mongo
    volumes:
      - .:/app
    cpus: 0.10

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.200.0/24
